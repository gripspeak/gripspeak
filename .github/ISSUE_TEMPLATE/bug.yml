name: Bug report
description: Something didn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you said or pressed, and what Gripspeak did instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where were you typing?
      placeholder: Steam chat, Chromium, Konsole, a game...
  - type: input
    id: version
    attributes:
      label: Gripspeak version
      description: Settings → About
      placeholder: "0.1.5"
  - type: markdown
    attributes:
      value: Please don't paste your purchase link or license details here; email those to support@gripspeak.com.
